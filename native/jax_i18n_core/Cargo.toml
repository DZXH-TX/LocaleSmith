[package]
name = "jax_i18n_core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Panic-safe native archive inspection core for JAX i18n"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
toml = "0.8.23"
# `zip` separates its Deflate codec switch from the flate2 backend feature.
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate-flate2", "flate2"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
