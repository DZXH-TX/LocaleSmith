name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_NOLOGO: "true"
  RUSTUP_AUTO_INSTALL: "1"

jobs:
  build-and-test:
    name: Windows x64 / Rust + .NET
    runs-on: windows-2025
    timeout-minutes: 45

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Verify pinned toolchains
        run: |
          dotnet --version
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Check Rust formatting
        run: cargo fmt --manifest-path native/localesmith_core/Cargo.toml --all -- --check

      - name: Run Rust Clippy
        run: cargo clippy --manifest-path native/localesmith_core/Cargo.toml --locked --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path native/localesmith_core/Cargo.toml --locked --all-targets

      - name: Build Rust native core
        run: cargo build --manifest-path native/localesmith_core/Cargo.toml --locked --release

      - name: Restore .NET dependencies
        run: dotnet restore LocaleSmith.slnx

      - name: Install Windows App SDK runtime
        run: |
          $installerPath = Join-Path $env:RUNNER_TEMP "WindowsAppRuntimeInstall-2.3.1-x64.exe"
          $installerUri = "https://aka.ms/windowsappsdk/2.3/2.3.1/windowsappruntimeinstall-x64.exe"
          $expectedHash = "4011748ddf472b7e856d909fdfb4e9b19c3d23fcd8121039ac91f99d5ffa65db"

          Invoke-WebRequest -Uri $installerUri -OutFile $installerPath

          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installerPath).Hash
          if (-not $actualHash.Equals($expectedHash, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Windows App SDK runtime installer checksum mismatch."
          }

          $signature = Get-AuthenticodeSignature -LiteralPath $installerPath
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid -or
              $signature.SignerCertificate.Subject -notmatch "O=Microsoft Corporation") {
            throw "Windows App SDK runtime installer does not have a valid Microsoft signature."
          }

          & $installerPath --quiet
          if ($LASTEXITCODE -ne 0) {
            throw "Windows App SDK runtime installer exited with code $LASTEXITCODE."
          }

          $runtime = Get-AppxPackage -Name "Microsoft.WindowsAppRuntime.2"
          if (-not $runtime) {
            throw "Windows App SDK 2.x runtime was not registered for the runner account."
          }
          $runtime | Select-Object Name, Version, Architecture

      - name: Check .NET formatting
        run: dotnet format LocaleSmith.slnx --verify-no-changes --no-restore

      - name: Build .NET solution
        run: dotnet build LocaleSmith.slnx --configuration Release --no-restore

      - name: Run .NET tests
        run: |
          # GitHub-hosted runners use a non-interactive service session. These four integration
          # tests require an interactive window station and private desktop, so they remain part
          # of local Windows validation instead of being weakened with continue-on-error here.
          $excludedHostedRunnerTests = @(
            "LocaleSmith.Infrastructure.Tests.SafeCliTests.RunnerRequiresApprovalAndWritesRedactedAudit",
            "LocaleSmith.Infrastructure.Tests.SafeCliTests.RealRestrictedChildRunsLowIntegrityInsideJobOnPrivateDesktop",
            "LocaleSmith.Infrastructure.Tests.SafeCliTests.RealRestrictedLauncherPreservesWindowsArgumentBoundaries",
            "LocaleSmith.Infrastructure.Tests.SafeCliTests.TimeoutTerminatesRestrictedProcessTree"
          )
          $testFilter = ($excludedHostedRunnerTests | ForEach-Object { "FullyQualifiedName!=$_" }) -join "&"

          Write-Output "Excluding $($excludedHostedRunnerTests.Count) private-desktop tests on the hosted runner."
          dotnet test LocaleSmith.slnx `
            --configuration Release `
            --no-build `
            --no-restore `
            --filter $testFilter `
            --logger trx `
            --results-directory artifacts/test-results

      - name: Verify .NET test discovery
        if: ${{ !cancelled() }}
        run: |
          $resultFiles = @(Get-ChildItem -LiteralPath "artifacts/test-results" -Filter "*.trx")
          if ($resultFiles.Count -ne 8) {
            throw "Expected results from 8 .NET test projects, found $($resultFiles.Count)."
          }

          $totalTests = 0
          foreach ($resultFile in $resultFiles) {
            [xml]$result = Get-Content -Raw -LiteralPath $resultFile.FullName
            $discoveredTests = [int]$result.TestRun.ResultSummary.Counters.total
            if ($discoveredTests -lt 1) {
              throw "No tests were discovered in $($resultFile.Name)."
            }
            $totalTests += $discoveredTests
          }

          Write-Output "Validated $($resultFiles.Count) test projects and $totalTests discovered tests."

      - name: Upload .NET test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnet-test-results
          path: artifacts/test-results/**/*.trx
          if-no-files-found: ignore
          retention-days: 14
